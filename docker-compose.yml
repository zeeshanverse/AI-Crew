services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_crew-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_crew}
      POSTGRES_USER: ${POSTGRES_USER:-ai_crew}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_crew}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ai_crew-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_crew -d ai_crew"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ai_crew-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"

  backend:
    build: ./backend
    container_name: ai_crew-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ai_crew}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ai_crew}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ai_crew}
      AI_SERVICE_URL: http://ai:8000
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-ai-crew-internal}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_started

  ai:
    build: ./ai
    container_name: ai_crew-ai
    environment:
      AI_MODE: ${AI_MODE:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      INTERNAL_API_BASE_URL: http://backend:8080
      INTERNAL_API_TOKEN: ${AI_INTERNAL_TOKEN:-ai-crew-internal}
    ports:
      - "${AI_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    container_name: ai_crew-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  ai_crew-postgres-data:
